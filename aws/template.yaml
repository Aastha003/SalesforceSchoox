AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Schedules a periodic sync of Schoox learner training progress into
  Salesforce Learner_Course__c records. Deployed with `sam deploy --guided`.

Parameters:
  SyncScheduleExpression:
    Type: String
    Default: rate(6 hours)
    Description: How often to run the Schoox -> Salesforce sync.
  SchooxAcademyId:
    Type: String
    Description: Schoox academy slug, e.g. AliSFTesting

Resources:
  SchooxApiSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: schoox-salesforce-sync/schoox-api
      Description: Schoox API key. Populate the SecretString after deploy — never commit real values.
      SecretString: '{"apiKey":"REPLACE_ME"}'

  SalesforceAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: schoox-salesforce-sync/salesforce-auth
      Description: Salesforce Connected App client-credentials. Populate after deploy.
      SecretString: '{"loginUrl":"https://data-speed-169.my.salesforce.com","clientId":"REPLACE_ME","clientSecret":"REPLACE_ME"}'

  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: sync-lambda/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          SCHOOX_SECRET_ID: !Ref SchooxApiSecret
          SALESFORCE_SECRET_ID: !Ref SalesforceAuthSecret
          SCHOOX_ACADEMY_ID: !Ref SchooxAcademyId
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref SchooxApiSecret
                - !Ref SalesforceAuthSecret
      Events:
        Scheduled:
          Type: Schedule
          Properties:
            Schedule: !Ref SyncScheduleExpression
            Description: Periodic Schoox -> Salesforce learner progress sync
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - GET

  DashboardWidgetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dashboard-widget/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          SALESFORCE_SECRET_ID: !Ref SalesforceAuthSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref SalesforceAuthSecret

  DashboardWidgetInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DashboardWidgetFunction
      Principal: cloudwatch.amazonaws.com

  SyncDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: schoox-salesforce-sync
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "custom",
              "x": 0, "y": 0, "width": 24, "height": 12,
              "properties": {
                "endpoint": "${DashboardWidgetFunction.Arn}",
                "params": {},
                "title": "Schoox Learner Progress (live, from Salesforce)",
                "updateOn": { "refresh": true, "resize": false, "timeRange": false }
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Sync Lambda Invocations / Errors",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${SyncFunction}", { "stat": "Sum" } ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${SyncFunction}", { "stat": "Sum" } ]
                ]
              }
            },
            {
              "type": "log",
              "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Latest Sync Results",
                "region": "${AWS::Region}",
                "query": "SOURCE '/aws/lambda/${SyncFunction}' | fields @timestamp, @message | filter @message like /Sync complete/ | sort @timestamp desc | limit 10",
                "view": "table"
              }
            }
          ]
        }

Outputs:
  SyncNowUrl:
    Description: Unauthenticated URL that triggers an on-demand sync when opened (e.g. from a Salesforce Custom Button).
    Value: !GetAtt SyncFunctionUrl.FunctionUrl
  SyncFunctionName:
    Value: !Ref SyncFunction
  DashboardWidgetFunctionName:
    Value: !Ref DashboardWidgetFunction
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=schoox-salesforce-sync"
  SchooxSecretArn:
    Value: !Ref SchooxApiSecret
  SalesforceSecretArn:
    Value: !Ref SalesforceAuthSecret
